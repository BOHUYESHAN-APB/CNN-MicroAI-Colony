# YOLOv12 配置文件 - 简化版

# 模型配置
model:
  architecture: yolov12.pt  # 模型架构文件路径

# 数据配置
data:
  path: /merged_dataset/  # 数据集根目录
  img_size: 640  # 图像大小

# 训练配置
train:
  epochs: 12  # 迭代周期设为12
  batch_size: 16  # 批量大小
  device: 0  # 使用的GPU设备
  resume: false  # 是否从断点续训

# 输出配置
output:
  path: ./model_output  # 模型输出路径