model:
  name: yolov5
  backbone: CSPDarknet
  num_classes: 1

data:
  train_path: ../../../../merged_dataset/train
  val_path: ../../../../merged_dataset/val
  test_path: ../../../../merged_dataset/test
  img_size: [640, 2048]

optimizer:
  type: Adam
  lr: 0.001
  weight_decay: 0.0005

training:
  batch_size: 16
  epochs: 100
  save_interval: 5
  resume: false
  checkpoint: ""

logging:
  log_dir: ./logs
  checkpoint_dir: ./checkpoints
  model_output: ./model_output