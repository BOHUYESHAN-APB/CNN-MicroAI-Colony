# YOLOv13 训练配置

model:
  architecture: yolov13n.pt  # YOLOv13基础模型
  num_classes: 85           # 菌落类别数

data:
  path: /merged_dataset     # COCO格式数据集路径
  img_size: [640, 2048]     # 多尺度训练范围
  train: train/             # 训练集路径
  val: valid/               # 验证集路径
  test: test/               # 测试集路径

train:
  epochs: 100               # 训练轮数
  batch_size: 16            # 批次大小
  device: 0                 # 使用GPU 0
  workers: 8                # 数据加载线程数
  lr0: 0.01                 # 初始学习率
  lrf: 0.1                  # 最终学习率
  momentum: 0.937           # SGD动量
  weight_decay: 0.0005      # 权重衰减
  warmup_epochs: 3          # 热身轮数
  cos_lr: true              # 余弦退火学习率

output:
  path: ./model_output      # 输出目录
  save_period: 5            # 保存间隔
  val: true                 # 验证