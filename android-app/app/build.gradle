apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.bohuyshan.microai.colony'
    compileSdk 36
    defaultConfig {
    applicationId 'com.bohuyshan.microai.colony'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildToolsVersion '36.1.0'
}

dependencies {
    def cameraxVersion = "1.3.4"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    // ONNX Runtime Android AAR (choose matching version)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.15.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}

def defaultRel = "onnx model/checkpoint_epoch_31.onnx"
def assetsDir = file("${projectDir}/src/main/assets")

tasks.register("copyOnnxModel", Copy) {
    doFirst {
        // ensure assets dir exists
        if (!assetsDir.exists()) {
            assetsDir.mkdirs()
        }

        // search candidate locations for the ONNX model
        def candidates = [
            new File(rootDir, defaultRel),                     // project root (if android-app is repo root)
            new File(rootDir.parentFile ?: rootDir, defaultRel), // repo root (parent of android-app)
            new File(projectDir, "src/main/assets/model.onnx")  // already in assets
        ]

        def sourceOnnxFile = candidates.find { it.exists() }
        if (sourceOnnxFile == null) {
            throw new RuntimeException("ONNX model not found in any candidate location. Searched: ${candidates*.path}\nPlease place 'checkpoint_epoch_31.onnx' in one of the above paths or copy a model to 'app/src/main/assets/model.onnx' before building.")
        }

        // configure copy from the discovered file
        from(sourceOnnxFile)
        into(assetsDir)
        rename { "model.onnx" }
    }
}

preBuild.dependsOn(copyOnnxModel)
