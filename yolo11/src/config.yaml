# YOLOv11 Configuration

model:
  name: 'yolo11'
  num_classes: 1
  input_size: 224
  backbone:
    channels: [32, 64, 128, 256, 512]
    activation: 'silu'
    residual_stages: [2, 3, 3]  # Number of residual blocks per stage
  neck:
    in_channels: 512
    out_channels: 256
    fpn_channels: 256
  head:
    in_channels: 256
    hidden_channels: 256
    attention:
      reduction: 16
      use_spatial: true
      use_channel: true

training:
  batch_size: 16
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0005
  momentum: 0.9
  lr_scheduler:
    type: 'cosine'
    warmup_epochs: 5
    min_lr: 0.00001
  
  # Advanced data augmentation
  augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotation: [-15, 15]
    brightness: 0.2
    contrast: 0.2
    blur_prob: 0.1
    noise_prob: 0.1
    cutout_prob: 0.1
    
  # Enhanced checkpoint settings
  checkpoint:
    save_freq: 5  # Save every n epochs
    save_best: true
    metric: 'accuracy'
    early_stopping:
      patience: 10
      min_delta: 0.001

# Testing parameters
testing:
  confidence: 0.01
  nms_threshold: 0.28
  score_threshold: 0.23
  min_size: 0
  max_size: 999
  test_time_augmentation:
    enabled: true
    scales: [0.8, 1.0, 1.2]
    flips: ['none', 'horizontal', 'vertical']

# Dataset paths
data:
  train: 'pic-all/train'
  val: 'pic-all/val'
  test: 'test-pic'
  classes: 'pic-all/classes.txt'

# Optimization settings
optimization:
  mixed_precision: true
  gradient_clipping: 5.0
  channels_last: true
